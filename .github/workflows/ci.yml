name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.7, 3.8, 3.9, "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov black flake8 mypy
    
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Treat all other issues as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Check code formatting with black
      run: |
        black --check .
    
    - name: Type check with mypy
      run: |
        mypy --ignore-missing-imports .
      continue-on-error: true  # Type checking is informational for now
    
    - name: Test import functionality
      run: |
        python -c "
        import sys
        sys.path.append('.')
        try:
            from options_base import OptionsScreener
            print('✅ Successfully imported OptionsScreener')
        except ImportError as e:
            print(f'❌ Import failed: {e}')
            
        try:
            from put_screener import PutScreener  
            print('✅ Successfully imported PutScreener')
        except ImportError as e:
            print(f'❌ Import failed: {e}')
            
        # Test basic instantiation (without IBKR connection)
        try:
            screener = OptionsScreener()
            print('✅ Successfully created OptionsScreener instance')
        except Exception as e:
            print(f'❌ Instantiation failed: {e}')
        "
    
    - name: Test help and version info
      run: |
        python put_option_test.py --help
        python -c "import __init__; print(f'Version: {__init__.__version__}')"
    
    - name: Install package in development mode
      run: |
        pip install -e .
    
    - name: Test installed package
      run: |
        python -c "
        try:
            import options_screener
            print(f'✅ Package installed successfully, version: {options_screener.__version__}')
        except ImportError as e:
            print(f'❌ Package import failed: {e}')
        "

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit
    
    - name: Check for security vulnerabilities
      run: |
        safety check --json || true
        bandit -r . -f json || true 